[project]
name = "dealerstudio"
version = "0.1.0"
description = "Local, non-generative vehicle listing photo studio"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = ["PySide6==6.10.0", "Pillow==12.0.0", "numpy==2.3.4", "onnxruntime==1.23.2"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "pyinstaller==6.16.0"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
