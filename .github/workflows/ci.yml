name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.9.5'
          python-version: '3.13.9'
          enable-cache: false
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1 libfreetype6 fonts-dejavu-core libx11-6 libxrender1 libxext6 libxcb1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./package.ps1
      - name: Explicit model setup for real Windows smoke test
        if: runner.os == 'Windows'
        run: uv run python -c "from studio.model import install; install()"
      - name: Exercise the actual packaged executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $studioFixture = Join-Path $PWD 'verification/camry.jpg'
          $studioOutput = Join-Path $env:RUNNER_TEMP 'dealerstudio-package-check'
          $studioCheck = Start-Process -FilePath './dist/DealerStudio/DealerStudio.exe' -ArgumentList @('--verify-package', "`"$studioFixture`"", "`"$studioOutput`"") -Wait -PassThru -WindowStyle Hidden
          if ($studioCheck.ExitCode -ne 0) {
            Get-Content "$env:USERPROFILE/.dealerstudio/startup-error.log" -ErrorAction SilentlyContinue
            Get-Content "$studioOutput/package-report.json" -ErrorAction SilentlyContinue
            throw "Packaged smoke test exited $($studioCheck.ExitCode)"
          }
          $studioReport = Get-Content "$studioOutput/package-report.json" | ConvertFrom-Json
          if (-not $studioReport.ok) { throw 'Packaged diagnostic did not succeed' }
          Get-Content "$studioOutput/package-report.json"
